<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shamus - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Main site container wrapper -->
    <main class="portfolio-card">
        
        <!-- Header Profile Section -->
        <header class="profile-header">
            <div class="avatar-wrapper">
                <img src="public/CSRP.png" alt="Shamus's Profile" class="profile-img">
            </div>
            <h1>Shamus</h1>
            <p class="subtitle">Developer</p>
        </header>

        <!-- Social Connections Row -->
        <div class="social-links">
            <a href="https://www.tiktok.com/@ilovelollies36" target="_blank" rel="noopener noreferrer" class="social-icon" title="TikTok">
                <img src="public/tiktok.png" alt="TikTok">
            </a>
            <a href=https://discord.gg/5w8aBkPw4K" target="_blank" rel="noopener noreferrer" class="social-icon" title="Discord">
                <img src="public/discord-icon.webp" alt="Discord">
            </a>
        </div>

        <hr class="section-divider">

        <!-- Showcase Section 1: Graphics -->
        <section class="portfolio-section">
            <h2>Graphics</h2>
            <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="project1.png" alt="Graphic Showcase 1">
                </div>
                <div class="gallery-item">
                    <img src="project2.png" alt="Graphic Showcase 2">
                </div>
            </div>
        </section>

        <hr class="section-divider">

        <!-- Showcase Section 2: Discord Status -->
        <section class="portfolio-section">
            <h2>Discord</h2>
            <p class="status-text">Coming Soon!</p>
        </section>

    </main>

</body>
</html>
